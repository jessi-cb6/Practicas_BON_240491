version: '3.8'

services:
  # --- SERVICIO 1: PostgreSQL ---
  postgres_240491:
    image: postgres:15-alpine
    container_name: postgres_240491
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data_240491:/var/lib/postgresql/data

  # --- SERVICIO 2: pgAdmin (Interfaz Web para Postgres) ---
  pgadmin_240491:
    image: dpage/pgadmin4
    container_name: pgadmin_240491
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres_240491
    volumes:
      - pgadmin_data_240491:/var/lib/pgadmin

  # --- SERVICIO 3: MySQL ---
  mysql_240491:
    image: mysql:8.0
    container_name: mysql_240491
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data_240491:/var/lib/mysql

volumes:
  postgres_data_240491:
    driver: local
  pgadmin_data_240491:
    driver: local
  mysql_data_240491:
    driver: local