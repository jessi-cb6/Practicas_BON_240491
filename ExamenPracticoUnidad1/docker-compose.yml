version: '3.8'

services:
  # --- SERVICIO 1: PostgreSQL ---
  postgres_240491:
    image: postgres:15-alpine
    container_name: postgres_240491
    restart: always
    environment:
      POSTGRES_DB: db_240491
      POSTGRES_USER: user_240491
      POSTGRES_PASSWORD: Password240491!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_240491:/var/lib/postgresql/data

  # --- SERVICIO 2: pgAdmin (Interfaz Web para Postgres) ---
  pgadmin_240491:
    image: dpage/pgadmin4
    container_name: pgadmin_240491
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: "jessica.cruz@utxicotepec.edu.mx"
      PGADMIN_DEFAULT_PASSWORD: "Password240491!"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "40491:80" # Puerto asignado para Postgres / pgAdmin
    depends_on:
      - postgres_240491

  # --- SERVICIO 3: MySQL ---
  mysql_240491:
    image: mysql:8.0
    container_name: mysql_240491
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Password240491!
      MYSQL_DATABASE: db_mysql_240491
      MYSQL_USER: user_240491
      MYSQL_PASSWORD: Password240491!
    ports:
      - "3306:3306"
    volumes:
      - mysql_data_240491:/var/lib/mysql

  # --- SERVICIO 4: phpMyAdmin (Interfaz Web para MySQL) ---
  phpmyadmin_240491:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_240491
    restart: always
    environment:
      PMA_HOST: mysql_240491
      MYSQL_ROOT_PASSWORD: Password240491!
    ports:
      - "40492:80" # Puerto asignado para MySQL / phpMyAdmin
    depends_on:
      - mysql_240491

volumes:
  postgres_data_240491:
    driver: local
  mysql_data_240491:
    driver: local