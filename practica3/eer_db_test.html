function layout(){let n=D.tables.length,cols=Math.ceil(Math.sqrt(n)),cw=300,ch=240;return D.tables.map((t,i)=>({x:35+(i%cols)*cw,y:35+Math.floor(i/cols)*ch,w:260,h:Math.max(100,65+t.columns.length*18)}))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let q=document.getElementById('search').value.toLowerCase(),showA=document.getElementById('attrs').checked,showR=document.getElementById('relations').checked,type=document.getElementById('typeFilter').value.toLowerCase();let p=positions;let out=[];out.push(`<g transform="translate(${tx},${ty}) scale(${scale})">`);if(showR)D.relations.forEach((r,i)=>{let a=D.tables.findIndex(t=>t.name===r.fromTable),b=D.tables.findIndex(t=>t.name===r.toTable);if(a<0||b<0)return;let A=p[a],B=p[b],x1=A.x+A.w/2,y1=A.y+A.h/2,x2=B.x+B.w/2,y2=B.y+B.h/2,active=!selected||selected===a||selected===b;out.push(`<path class="edge ${active?'':'dim'} ${selected===a||selected===b?'active':''} ${r.confirmed?'':'inferred'}" d="M${x1} ${y1} C${(x1+x2)/2} ${y1},${(x1+x2)/2} ${y2},${x2} ${y2}" onclick="detailRelation(${i})"/><text class="edge-label" x="${(x1+x2)/2}" y="${(y1+y2)/2-5}" onclick="detailRelation(${i})">${r.confirmed?'':'∼ ' }R${String(i+1).padStart(2,'0')} · N:1</text>`)});D.tables.forEach((t,i)=>{let P=p[i],matches=!q||t.name.toLowerCase().includes(q)||t.columns.some(c=>c.name.toLowerCase().includes(q));let typeMatches=!type||t.columns.some(c=>c.type.toLowerCase().startsWith(type));let dim=(selected!==null&&selected!==i&&!D.relations.some(r=>(r.fromTable===t.name&&D.tables[selected]?.name===r.toTable)||(r.toTable===t.name&&D.tables[selected]?.name===r.fromTable)))||!matches||!typeMatches;out.push(`<g class="node color-${i%7} ${selected===i?'selected':''} ${dim?'dim':''}" transform="translate(${P.x},${P.y})" onclick="selectTable(${i})"><rect width="${P.w}" height="${P.h}"/><text class="node-title" x="12" y="21">E${String(i+1).padStart(2,'0')} · ${esc(t.name)}</text><text class="node-meta" x="12" y="39">${t.rows.toLocaleString('es-MX')} filas · ${t.columns.length} columnas</text>`);if(showA)t.columns.forEach((c,j)=>{let tags=[c.pk?'PK':null,c.fk?'FK':null,c.uk?'UK':null,!c.nullable?'NN':null,c.autoIncrement?'AI':null].filter(Boolean).join(' ');out.push(`<text class="attr ${c.pk?'key':''}" x="12" y="${59+j*16}">A${String(j+1).padStart(2,'0')} ${esc(c.name)} <tspan class="node-meta">${esc(c.type)}</tspan><tspan class="tag"> ${tags}</tspan></text>`)});out.push('</g>')});out.push('</g>');svg.innerHTML=out.join('')}
function selectTable(i){selected=i;let t=D.tables[i],rel=D.relations.map((r,j)=>({...r,j})).filter(r=>r.fromTable===t.name||r.toTable===t.name);document.getElementById('detail').innerHTML=`<div class="muted">E${String(i+1).padStart(2,'0')} · Entidad</div><h2>${esc(t.name)}</h2><p class="muted">${t.rows.toLocaleString('es-MX')} registros contenidos en el respaldo · ${t.columns.length} columnas</p><h3>Atributos</h3>${t.columns.map((c,j)=>{let tags=[c.pk?'PK':null,c.fk?'FK':null,c.uk?'UK':null,!c.nullable?'NN':null,c.autoIncrement?'AI':null].filter(Boolean).join(' · ');let relation=D.relations.find(r=>r.fromTable===t.name&&r.fromCols.includes(c.name));return `<div class="col" ${relation?'onclick="goTo(\''+esc(relation.toTable)+'\')" style="cursor:pointer"':''}><strong>A${String(j+1).padStart(2,'0')} ${esc(c.name)} ${tags?`${tags.split(' · ').map(tag=>`<span class="pill badge-${tag.toLowerCase()}">${tag}</span>`).join(' ')}`:''}</strong><code>${esc(c.declaration)}</code>${c.default!==null?`<small>DEFAULT ${esc(c.default)}</small>`:''}${c.enum.length?`<small>ENUM: ${c.enum.map(esc).join(', ')}</small>`:''}${relation?`<small>→ ${esc(relation.toTable)} (ir a entidad)</small>`:''}</div>`}).join('')}<h3>Índices y restricciones</h3>${t.constraints.map(x=>`<div class="col"><code>${esc(x)}</code></div>`).join('')||'<span class="muted">Sin restricciones/index declarados.</span>'}<h3>Relaciones</h3>${rel.map(r=>`<div class="rel" onclick="detailRelation(${r.j})"><b>R${String(r.j+1).padStart(2,'0')}</b> ${esc(r.fromTable)}.${r.fromCols.join(',')} → ${esc(r.toTable)}.${r.toCols.join(',')}<br>Cardinalidad: 1:N (FK en origen) · ${esc(r.rules||'sin regla ON DELETE/UPDATE declarada')}</div>`).join('')||'<span class="muted">Sin FK declaradas.</span>'}`;render()}
function detailRelation(i){let r=D.relations[i];document.getElementById('detail').innerHTML=`<div class="muted">R${String(i+1).padStart(2,'0')} · ${r.confirmed?'Relación confirmada por FK':'Relación inferida · pendiente de validación'}</div><h2>${esc(r.fromTable)} → ${esc(r.toTable)}</h2><p>${r.confirmed?'FK':'Columna candidata'}: <b>${esc(r.fromCols.join(', '))}</b> · ${r.confirmed?'PK/UK referenciada':'Columna destino propuesta'}: <b>${esc(r.toCols.join(', '))}</b></p><p>Cardinalidad derivada desde el lado origen: N:1; una FK UNIQUE podría convertirla en 1:1. Participación del lado FK ${r.fromCols.every(c=>D.tables.find(t=>t.name===r.fromTable).columns.find(x=>x.name===c)?.nullable)?'opcional':'obligatoria'} según NULL/NOT NULL.</p><p>Reglas referenciales: ${esc(r.rules||'ON DELETE/UPDATE no declarados explícitamente')}</p><button onclick="goTo('${esc(r.fromTable)}')">Ir a origen</button> <button onclick="goTo('${esc(r.toTable)}')">Ir a destino</button>`;render()}
function goTo(name){let i=D.tables.findIndex(t=>t.name===name);if(i>=0){selectTable(i);fitNode(i)}}function fitNode(i){let p=positions[i];tx=100-p.x*scale;ty=140-p.y*scale;render()}function showOverview(){selected=null;document.getElementById('detail').innerHTML='<div class="muted">Vista general del modelo completo. Selecciona una entidad o relación para ver detalles.</div>';fit()}function zoom(f){scale=Math.max(.35,Math.min(2.5,scale*f));render()}function fit(){scale=Math.min(1,(svg.clientWidth-30)/(Math.max(...positions.map(p=>p.x+p.w))+30),(svg.clientHeight-30)/(Math.max(...positions.map(p=>p.y+p.h))+30));tx=10;ty=10;render()}function exportSvg(){let b=new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='diagrama_eer.svg';a.click();URL.revokeObjectURL(a.href)}function downloadCsv(){let rows=[['Codigo','Tabla','Atributo','Tipo','PK','FK','UK','NN','AI','Default','Registros']];D.tables.forEach((t,i)=>t.columns.forEach((c,j)=>rows.push([`E${String(i+1).padStart(2,'0')}`,t.name,`A${String(j+1).padStart(2,'0')} ${c.name}`,c.type,c.pk,c.fk,c.uk,!c.nullable,c.autoIncrement,c.default,t.rows])));let csv=rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='inventario_eer.csv';a.click();URL.revokeObjectURL(a.href)}
let canvas=document.getElementById('canvas');canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.08:.92)},{passive:false});canvas.addEventListener('pointerdown',e=>{if(e.target.closest('.node')||e.target.closest('.edge-label'))return;drag={x:e.clientX,y:e.clientY,tx,ty};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(drag){tx+=e.clientX-drag.x;ty+=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;render()}});canvas.addEventListener('pointerup',()=>drag=null);init();</script></body></html>
